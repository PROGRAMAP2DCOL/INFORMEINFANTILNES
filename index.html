  return `<section class="execLayout"><div class="execTableCard">${tbl(['#','Distrito','Ciudades principales','MIPRES','Gest.','No gest.','Tránsito','Fuera comp.','% Gest.','Efectividad','Activos'],rows)}</div><div class="execChartCard"><div class="execChartTitle">Composición por distrito</div>${legend}${stackRows(gr,Math.max(1,...gr.map(x=>x[1]+x[2]+x[3]+x[4])))}</div></section>`;
};
P.topdm=()=>{
  // Esta pantalla ignora cualquier selección global de distrito y reúne todos los DM.
  const a=F(['zona']).filter(r=>r.deleg&&r.deleg!=='SIN ASIGNAR');
  const all=[...by(a,r=>r.deleg)].sort((x,y)=>y[1].length-x[1].length),m=all.slice(0,10);
  const ranked=m.reduce((sum,x)=>sum+x[1].length,0),lead=m[0]?m[0][0]:'—';
  const rows=all.map(([d,v],i)=>{const e=eff(v),city=topN(v,r=>r.ciudad,2).map(x=>esc(x[0])).join(' · '),districts=topN(v,r=>r.zona,2).map(x=>esc(x[0])).join(' · ');return `<tr><td class="execRank">${i+1}</td><td class="execName">${esc(d)}</td><td class="execText">${city||'—'}</td><td class="execText">${districts||'—'}</td><td class="execNum">${fmt(v.length)}</td><td class="execNum">${fmt(cc(v,G))}</td><td class="execNum">${fmt(cc(v,N))}</td><td class="execNum">${fmt(cc(v,T))}</td><td class="execNum">${fmt(cc(v,FC))}</td>${rate(pct(cc(v,G),v.length),'rateG')}<td class="execRate ${e>=60?'g':e>50?'o':'r'}">${e}%</td></tr>`});
  const gr=m.map(([d,v])=>[d,cc(v,G),cc(v,N),cc(v,T),cc(v,FC)]);
  return kpis([['Delegados médicos',fmt(all.length)],['MIPRES con DM asignado',fmt(a.length)],['Participación del Top 10',pct(ranked,a.length)+'%',1]])+`<section class="execLayout"><div class="execTableCard">${tbl(['#','Delegado médico','Ciudades principales','Distritos principales','MIPRES','Gest.','No gest.','Tránsito','Fuera comp.','% Gest.','Efectividad'],rows)}<div class="execFoot">La tabla muestra todos los delegados médicos registrados. El gráfico presenta el Top 10. Sin filtro de distrito; respeta los demás filtros disponibles.</div></div><div class="execChartCard"><div class="execChartTitle">Composición por delegado médico · Top 10</div>${legend}${stackRows(gr,Math.max(1,...gr.map(x=>x[1]+x[2]+x[3]+x[4])))}</div></section>`;
};
P.productos=()=>{
  const a=F(['cat','status']).filter(r=>r.cat===G&&r.prod),pm=[...by(a,r=>r.prod)].sort((x,y)=>y[1].length-x[1].length).slice(0,8),mx=pm[0]?pm[0][1].length:1;
  const fm=[...by(a,r=>r.fam)].sort((x,y)=>y[1].length-x[1].length),pal=['#0b547b','#1ea85b','#ee9b18','#8257ee','#df4a52','#2b9bd9'];let acc=0;
  const stops=a.length?fm.map(([k,v],i)=>{const s=acc/a.length*100;acc+=v.length;return `${pal[i%6]} ${s.toFixed(2)}% ${(acc/a.length*100).toFixed(2)}%`}).join(','):'#d9e1e8 0 100%';
  return `<section class="prodLayout"><div class="prodPanel"><div class="prodPanelTitle">Presentaciones más formuladas</div><div class="prodPanelSub">Top 8 por MIPRES gestionables</div><div class="prodBars">${pm.map(([p,v])=>`<div class="prodBarItem"><div class="prodBarHead"><div class="prodBarName" title="${esc(p)}">${esc(p)}</div><div class="prodBarValue">${fmt(v.length)} · ${pct(v.length,a.length)}%</div></div><div class="prodBarTrack"><div class="prodBarFill" style="width:${v.length/mx*100}%"></div></div></div>`).join('')||'<div class="prodLegendEmpty">Sin datos</div>'}</div></div>
  <div class="prodPanel"><div class="prodPanelTitle">Participación por producto</div><div class="prodPanelSub">Familias de producto · MIPRES gestionables</div><div class="prodPieWrap"><div class="prodDonut" style="background:conic-gradient(${stops})"><div class="prodDonutCenter">${fmt(a.length)}<span>MIPRES</span></div></div><div class="prodFamilyLegend">${fm.map(([k,v],i)=>`<div class="prodFamilyItem"><span class="prodFamilyDot" style="background:${pal[i%6]}"></span><div><div class="prodFamilyName">${esc(k)}</div><div class="prodFamilyMeta">${fmt(v.length)} · ${pct(v.length,a.length)}%</div></div></div>`).join('')}</div></div></div></section>`;
};
P.alertas=()=>{
  const a=F(),q=a.filter(r=>r.pqr),qj=a.filter(r=>r.queja),tu=a.filter(r=>r.tutela);
  const tb=(f,n)=>[...by(a,f)].map(([k,v])=>[k,v.length,v.filter(r=>r.pqr).length,v.filter(r=>r.queja).length,v.filter(r=>r.tutela).length]).sort((x,y)=>(y[3]+y[4])-(x[3]+x[4])).slice(0,n);
  const rw=l=>l.map(([k,n,p,qq,t],i)=>`<tr><td class="prescRank">${i+1}</td><td class="prescName">${esc(k)}</td><td class="prescNum">${fmt(n)}</td><td class="prescNum">${fmt(p)}</td><td class="prescNum">${fmt(qq)}</td><td class="prescNum">${fmt(t)}</td>${rate(pct(qq+t,n),'rateO')}</tr>`);
  const H=['#','','MIPRES','PQR','Quejas','Tutelas','% queja+tutela'];
  return kpis([['MIPRES con PQR',fmt(q.length)+' · '+pct(q.length,a.length)+'%'],['MIPRES con queja',fmt(qj.length)+' · '+pct(qj.length,a.length)+'%'],['MIPRES con tutela',fmt(tu.length)+' · '+pct(tu.length,a.length)+'%']])+`<section class="panel2"><div class="prescTableCard"><div class="execChartTitle" style="padding:14px 14px 0">Por distrito (ordenado por quejas + tutelas)</div>${tbl(H.map((h,i)=>i==1?'Distrito':h),rw(tb(r=>r.zona,10)))}</div><div class="prescTableCard"><div class="execChartTitle" style="padding:14px 14px 0">Por EPS · Top 10</div>${tbl(H.map((h,i)=>i==1?'EPS':h),rw(tb(r=>r.eps,10)))}</div></section>`;
};

function build(){
  document.getElementById('nav').innerHTML=PAGES.map(([id,l])=>`<button class="navbtn${id===ui.page?' active':''}" data-p="${id}">${l}</button>`).join('');
  document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{ui.page=b.dataset.p;ui.open=null;build();render()});
  document.getElementById('pages').innerHTML=PAGES.map(([id])=>`<section class="page${id===ui.page?' active':''}" id="page-${id}"><div class="gtitle" id="t-${id}">${TITLES[id][0]}</div><div class="gsubtitle">${TITLES[id][1]}</div><div class="filters" id="f-${id}"></div><div class="fileinfo"><div><span class="pill"><span class="dot"></span>Vista dinámica</span></div><div id="i-${id}"></div></div><div id="c-${id}"></div></section>`).join('');
}
function render(){
  const id=ui.page;renderFilters(id);
  const a=id==='topdm'?F(['zona']):F();document.getElementById('i-'+id).textContent=fmt(a.length)+' MIPRES visibles';
  document.getElementById('c-'+id).innerHTML=id==='resumen'?P.resumen(a):P[id]();
  if(id==='prescriptores')document.getElementById('t-'+id).textContent='Top 10 Prescriptores — '+(ui.prescZona||'todos los distritos');
  if(id==='eps')document.getElementById('t-'+id).textContent='Top 10 EPS MIPRES Gestionables — '+(ui.epsDeleg?dn(ui.epsDeleg):'todos los distritos');
  document.getElementById('stamp').textContent='Datos: '+fileName+' · '+fmt(FACT.length)+' MIPRES · Actualizado: '+new Date(updatedAt).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'});
}
document.addEventListener('click',()=>{ui.open=null;document.querySelectorAll('.filter.open').forEach(x=>x.classList.remove('open'))});
function publicHtml(){
  const root=document.documentElement.cloneNode(true);
  root.querySelectorAll('.adminOnly,#xlsxLib').forEach(e=>e.remove());
  root.querySelector('#pages').innerHTML='';root.querySelector('#nav').innerHTML='';root.querySelector('#stamp').textContent='';
  root.querySelector('#rawData').textContent='window.__RAW__='+JSON.stringify(RAW).replace(/<\//g,'<\\/')+';window.__META__='+JSON.stringify({file:fileName,at:updatedAt})+';';
  const a=root.querySelector('#appJs');a.textContent=a.textContent.replace('const ADMIN=true;','const ADMIN=false;');
  return '<!DOCTYPE html>\n<html lang="es">'+root.innerHTML+'</html>';
}
document.getElementById('printBtn').onclick=()=>window.print();
if(ADMIN){
document.getElementById('publicBtn').onclick=()=>{const b=new Blob([publicHtml()],{type:'text/html;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='Dashboard_Ejecutivo_P2D_Infantil_Pediatria_publico.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)};
document.getElementById('resetBtn').onclick=()=>{loadEmbedded();initSel();ui.prescZona='';ui.epsDeleg='';render()};
document.getElementById('excelInput').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  if(typeof XLSX==='undefined'){alert('No se pudo cargar la librería de Excel. Verifica tu conexión.');return}
  const rd=new FileReader();
  rd.onload=ev=>{try{
    const wb=XLSX.read(ev.target.result,{type:'array'}),sheet=wb.Sheets[wb.SheetNames[0]],grid=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''}),raw=[];
    let rows=[];
    const first=(grid[0]||[]).map(v=>S(v).toUpperCase()),catRow=grid.findIndex(r=>S((r||[])[0]).toUpperCase()==='CATEGORIA');
    const infantSchema=first.includes('ESTADO DEL PACIENTE')&&first.includes('STATUS')&&first.includes('DISTRITO')&&catRow>=0;
    if(infantSchema){
      grid.slice(catRow+1).forEach(r=>{
        if(!S(r[0]))return;
        const m={'CATEGORIA':r[0],'ESTADO DEL PACIENTE':r[1],'FECHA DE MIPRES':r[2],'PRESCRIPTOR':r[17],'CIUDAD/MUNICIPIO':r[7],'ZONA':r[29],'IPS':r[19],'EPS':r[18],'P.DISPENSACION':r[20],'PRODUCTO':r[12],'DELEGADO MEDICO':r[28],'ESTATUS ACTUAL':r[21],'PQR':r[23],'QUEJA':r[24],'TUTELA':r[26],'OBSERVACION ESTATUS':r[22]};
        const item=norm(c=>m[c]);if(item){rows.push(item);raw.push(COLS.map(c=>S(m[c])))}
      });
    }else{
      const js=XLSX.utils.sheet_to_json(sheet,{defval:''});
      rows=js.map(o=>{const m={};Object.keys(o).forEach(k=>m[S(k).toUpperCase()]=o[k]);const r=norm(c=>m[c]);if(r)raw.push(COLS.map(c=>S(m[c])));return r}).filter(Boolean);
    }
    if(!rows.length)throw new Error('no se encontraron filas válidas (revisa las columnas CATEGORIA y STATUS)');
    FACT=rows;RAW=raw;fileName=f.name;updatedAt=new Date().toISOString();initSel();ui.prescZona='';ui.epsDeleg='';render();
  }catch(err){alert('No se pudo leer el Excel: '+err.message)}};
  rd.readAsArrayBuffer(f);e.target.value='';
};}
loadEmbedded();initSel();build();render();
</script>
